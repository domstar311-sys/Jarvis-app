name: Build JARVIS APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip libffi-dev libssl-dev
          pip install buildozer cython==0.29.33
      - name: Extract zip
        run: |
          ls
          unzip -o "*.zip" || unzip -o "*/*.zip" || unzip -o "**/*.zip" || true
          find. -name "main.py" -type f
          # copy from nested folders to root
          find. -name "main.py" -exec cp {}./main.py \; 2>/dev/null || true
          find. -name "buildozer.spec" -exec cp {}./buildozer.spec \; 2>/dev/null || true
          ls -lh
      - name: Build
        run: buildozer android debug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
